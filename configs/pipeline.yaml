# configs/pipeline.yaml -- EL ÚNICO archivo que se edita para el diagnóstico.
#
# Precedencia: flag de línea de comandos > valor fijado en código > este archivo > default.
# Clave desconocida o valor inválido detiene la corrida y lista las claves válidas.
# Otro archivo: python main.py --config ruta\otro.yaml
# Origen de cada valor en execution.log ("Configuration file: ... | sources: {...}").

data:
  # Columnas que solo identifican un registro: nunca son feature del modelo.
  # Superconjunto de dashboard.identity_columns (esa lista se agrega aquí sola,
  # no hace falta repetirla). Un nombre SOLO aquí queda fuera del modelo pero
  # NO se muestra en la tarjeta del dashboard. Nombre ausente del panel: solo avisa.
  identification_columns: [despuestocolaboradoragrupado, numedad, codmatricula]

diagnostic:
  # Corre el capítulo "Diagnóstico cruzado IF-VAE" (false lo omite).
  # run_suite: true

  # Instala el paquete vendorizado (tools/if_vae_diagnostic_suite) si falta.
  # auto_install_suite: true

  # Columna del panel para el desglose de la sección 8 "Por segmento".
  # Default 'segment'; si no existe, intenta 'despuestocolaboradoragrupado'.
  # Explícita (sin '#') y ausente: la corrida se detiene al inicio. '' desactiva.
  # segment_column: region

  # Vista agregada por entidad en el capítulo diagnóstico.
  # entity_view: true

  # Reajustes con otra semilla para medir estabilidad (0 = desactivar).
  # stability_refits: 3

  # Umbrales de percentil de la malla de sensibilidad, en (0, 1).
  # sensitivity_grid: [0.90, 0.95, 0.99]

dashboard:
  # Columnas bajo el ID de la entidad en la tarjeta del caso, una fila por
  # campo en este orden. Ninguna es feature del modelo (se agregan solas a
  # data.identification_columns). Si el valor cambia entre meses, se muestra
  # el del último mes no vacío, por campo.
  identity_columns: [despuestocolaborador]

# ---------------------------------------------------------------------------
# Apartado 9: experimentos del capítulo diagnóstico. Todo descriptivo (sin
# umbral pasa/no pasa), sobre los datos de esta corrida.
# ---------------------------------------------------------------------------
experiments:
  # Familias a ejecutar (todas por defecto):
  #   capacity          Capacidad y dimensión latente (reentrena VAE)
  #   beta_kl           Beta y programación KL (reentrena VAE)
  #   loss_by_type      Pérdidas por tipo de feature (sin reentrenar)
  #   ablation          Ablación de familias de features
  #   backtest          Backtests temporales (reprocesa y reajusta)
  #   window_stability  Estabilidad entre ventanas (reusa el backtest)
  families: [capacity, beta_kl, loss_by_type, ablation, backtest, window_stability]

  # Presupuesto compartido de reentrenos de VAE entre todas las familias arriba.
  vae_fit_budget: 16
  # Tope de épocas por reentreno y de filas de ajuste.
  epoch_cap: 15
  max_fit_rows: 300000

  # Mallas de los barridos. Sin la clave = puntos automáticos; [] = apaga ese barrido.
  # capacity_grid: [4, 8, 16]      # latent_dim
  # beta_grid: [0.25, 1.0, 4.0]
  # kl_anneal_grid: [0, 10]
  # contamination_grid: [0.02, 0.01, 0.005]   # puntos de operación del score IF

  # Backtest de orígenes móviles.
  backtest_origins: 6            # últimos N periodos como orígenes
  backtest_vae_origins: 2        # cuántos de ellos también reentrenan el VAE
  backtest_min_fit_periods: 4    # periodos mínimos de ajuste

# ---------------------------------------------------------------------------
# Isolation Forest: selección posterior al tuneo (src/models/iforest.py).
# Costo: (min(selection_top_k, iforest_trials) + 1) * noise_seeds reajustes
# completos, cada uno sobre el conjunto de validación completo.
# ---------------------------------------------------------------------------
iforest:
  # selection_top_k: 5   # 0 = usar el ganador del tuneo sin reevaluar
  # noise_seeds: 3        # mínimo 2

# ---------------------------------------------------------------------------
# VAE: cómo ve las variables categóricas (src/models/mixed_vae.py). El
# Isolation Forest no cambia.
# ---------------------------------------------------------------------------
vae:
  # onehot    : una columna por nivel (default actual).
  # embedding : un índice + embedding aprendido por variable categórica
  #             (--vae-categorical-representation embedding para probarlo).
  categorical_representation: onehot

  # Solo se usan con `embedding`.
  categorical_embedding:
    dimension_strategy: auto     # auto: por cardinalidad; fixed: usa `dimension`
    # dimension: 8               # solo con dimension_strategy: fixed
    min_dimension: 2
    max_dimension: 32
  reconstruction_loss:
    numeric: huber               # huber | mse
    boolean: binary_cross_entropy
    categorical: cross_entropy
    aggregate_by_original_feature: true   # una contribución por variable original
  loss_weights:
    numeric: 1.0
    boolean: 1.0
    categorical: 1.0
  unknown_category_policy: explicit_token   # nivel no visto -> token UNKNOWN
  missing_category_policy: explicit_token   # nulo -> token MISSING
