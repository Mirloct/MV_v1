[pytest]
testpaths = tests
filterwarnings =
    # umap-learn probes for TensorFlow on import to offer its optional
    # ParametricUMAP backend. This project never installs TensorFlow (a
    # heavy dependency for a feature nothing here calls -- UMAP is used only
    # via its default, non-parametric path), so the warning fires on every
    # run regardless of anything in this codebase. Third-party and upstream:
    # filtered here by exact message rather than left to repeat in every
    # warnings summary, so a *new*, unexpected warning still surfaces.
    ignore:Tensorflow not installed; ParametricUMAP will be unavailable:ImportWarning
